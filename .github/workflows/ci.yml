name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      # Hosted runners are not all the same CPU, and INT8 results depend on it (VNNI or not), so record it.
      - name: Runner hardware
        run: infer-bench env
      # Tests marked "timing" assert on wall-clock measurements; shared CI runners are too noisy for them.
      - name: Test
        run: python -m pytest -m "not timing"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t infer-bench .
      # selfcheck asserts on timing, which a shared runner cannot promise, so the smoke test is a short real run.
      - name: Smoke test
        run: |
          docker run --rm infer-bench --version
          docker run --rm --entrypoint sh infer-bench -c \
            "infer-bench demo-model classifier -o m.onnx && infer-bench run m.onnx --iterations 50 --no-save"
